name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Integration tier"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - hot
          - tutorial
          - typed-tools
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    if: github.event.inputs.tier != 'tutorial' && github.event.inputs.tier != 'typed-tools'
    name: Run core live integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve integration tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TIER: ${{ github.event.inputs.tier }}
        run: |
          tier="stable"
          if [ "${EVENT_NAME}" = "schedule" ]; then
            tier="hot"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${DISPATCH_TIER}" = "hot" ]; then
            tier="hot"
          fi
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"
          echo "Running integration tier: ${tier}"

      - name: Refresh integration model pool
        if: steps.tier.outputs.tier == 'hot'
        run: ./scripts/sync_model_pool.sh

      - name: Run integration tests (or skip when secret missing)
        env:
          OPENROUTER_INTEGRATION_TIER: ${{ steps.tier.outputs.tier }}
          OPENROUTER_TEST_HOT_RESPONSES_MODELS_LIMIT: "10"
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY secret is not configured; skipping integration tests."
            exit 0
          fi
          cargo test --test integration -- --nocapture --skip management::

  management-smoke:
    if: github.event.inputs.tier != 'tutorial' && github.event.inputs.tier != 'typed-tools'
    name: Run management-key smoke integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
      OPENROUTER_PROVISIONING_KEY: ${{ secrets.OPENROUTER_PROVISIONING_KEY }}
      OPENROUTER_RUN_MANAGEMENT_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run management smoke tests (or skip when secret missing)
        run: |
          if [ -z "${OPENROUTER_MANAGEMENT_KEY}" ] && [ -n "${OPENROUTER_PROVISIONING_KEY}" ]; then
            OPENROUTER_MANAGEMENT_KEY="${OPENROUTER_PROVISIONING_KEY}"
            export OPENROUTER_MANAGEMENT_KEY
          fi

          if [ -z "${OPENROUTER_MANAGEMENT_KEY}" ]; then
            echo "OPENROUTER_MANAGEMENT_KEY secret is not configured; skipping management smoke tests."
            exit 0
          fi

          cargo test --test integration management:: -- --nocapture

  tutorial-smoke:
    name: Run real Axum streaming tutorial
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tutorial example
        run: cargo build --locked --example axum_chat_gateway
      - name: Verify real streaming through curl
        run: python3 scripts/smoke_axum_gateway.py
      - name: Retain tutorial verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axum-tutorial-smoke
          path: axum-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 30

  typed-tool-smoke:
    name: Run real typed-tool tutorial
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'typed-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: deepseek/deepseek-v4.1-flash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the typed-tool tutorial example
        run: cargo build --locked --example typed_tool_agent
      - name: Verify both tools and the final answer through OpenRouter
        run: python3 scripts/smoke_typed_tool_agent.py
      - name: Retain tutorial verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-tool-tutorial-smoke
          path: typed-tool-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 30
