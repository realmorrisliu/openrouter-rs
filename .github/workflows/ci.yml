name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Audit dependencies for vulnerabilities
        run: just audit

      - name: Check formatting
        run: just fmt-check

      - name: Cargo check (library without dev features)
        run: just check-lib

      - name: Cargo check (default features)
        run: just check

      - name: Run clippy (deny warnings)
        run: just clippy

      - name: Run unit tests
        run: just test-unit

      - name: Run crate-internal lib tests
        run: just test-lib

      - name: Run doctests
        run: just test-doc

      - name: Test adoption metrics collector
        run: just test-adoption-metrics

      - name: Test Axum gateway streaming and cancellation
        run: just test-axum-gateway

      - name: Test typed-tool agent protocol and stopping limits
        run: just test-typed-tool-agent

      - name: Run deterministic integration subsets
        run: just test-integration-subsets

      - name: Run CLI foundation tests
        run: just test-cli

  wasip3-check:
    name: WASI (wasip3) Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy (wasip3 backend, no reqwest)
        run: just check-wasip3

      - name: Install Wasmtime
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime@50.0.0

      - name: Test WASI HTTP and streaming in a real host
        run: just test-wasip3

  msrv-check:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (1.93.0)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: wasm32-wasip2

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (library without dev features)
        run: just check-lib

      - name: Cargo check (all targets/default features)
        run: just check

      - name: Cargo check (all targets/features)
        run: just check-all-features

      - name: Build WASI command component at MSRV
        run: cargo build --locked --manifest-path tests/fixtures/wasip3-smoke/Cargo.toml --target wasm32-wasip2 --target-dir target/wasip3-smoke

  migration-smoke:
    name: Migration Smoke Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate migration docs structure
        run: just check-migration-docs

      - name: Run migration smoke tests
        run: just test-migration-smoke
